<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VIC 光伏储能可行性（网页版）</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      :root {
        --green: #16a34a;
        --bg: #f7faf8;
        --card: #ffffff;
        --line: #dbe6dd;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", Arial, sans-serif;
        background: var(--bg);
        color: #111827;
      }
      .container { max-width: 1140px; margin: 0 auto; padding: 20px; }
      h1 { margin: 0 0 6px; color: #0f172a; font-size: 26px; }
      .subtitle { margin-top: 0; color: #4b5563; }
      .grid { display: grid; grid-template-columns: 1fr 1.8fr; gap: 20px; }
      @media (max-width: 980px) {
        .grid { grid-template-columns: 1fr; }
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-left: 5px solid var(--green);
        border-radius: 12px;
        padding: 16px;
      }
      .small {
        color: #6b7280;
        font-size: 13px;
      }
      label { display: block; margin: 10px 0 6px; font-weight: 600; }
      input, select, button, textarea {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        margin-bottom: 10px;
        font-size: 14px;
      }
      .btn {
        background: var(--green);
        color: white;
        border: none;
        cursor: pointer;
        font-weight: 600;
      }
      .btn:hover { opacity: 0.93; }
      .btn:disabled { opacity: 0.6; cursor: not-allowed; }
      .btn.secondary {
        background: #4b5563;
      }
      .kpi-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 8px; }
      .kpi {
        background: #f9fafb;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        padding: 10px 12px;
      }
      .kpi .label { color: #6b7280; font-size: 12px; }
      .kpi .value { font-size: 20px; font-weight: 700; margin-top: 4px; }
      .row { display: flex; gap: 10px; align-items: center; }
      .row .btn { width: auto; flex: 0; padding: 8px 12px; }
      table { border-collapse: collapse; width: 100%; font-size: 13px; }
      th, td { border-bottom: 1px solid #e5e7eb; padding: 8px; text-align: right; }
      th { background: #f9fafb; }
      .msg { padding: 10px; border-radius: 8px; margin: 8px 0; }
      .msg.error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
      .msg.ok { background: #ecfdf5; color: #065f46; border: 1px solid #bbf7d0; }
      .split {
        display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
      }
      @media (max-width: 780px) { .split { grid-template-columns: 1fr; } }
      .tagline { margin-top: 16px; font-size: 13px; color: #374151; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>VIC 工商业光伏 + 储能 可行性（网页版）</h1>
      <p class="subtitle">上传电表明细 + 账单文件，快速得到方案对比、节省/回收期和图表分析。</p>

      <div class="grid">
        <section class="card">
          <h3>1) 输入参数</h3>
          <form id="analyzeForm">
            <label>负荷明细（必填）</label>
            <input type="file" name="load_file" accept=".csv,.xlsx,.xls" required />
            <small class="small">列包含时间戳和用电量（kWh）</small>

            <label>账单摘要（可选）</label>
            <input type="file" name="bill_file" accept=".csv,.xlsx,.xls" />

            <label>峰段电价（AUD/kWh）</label>
            <input type="number" step="0.001" name="peak_rate" value="0.278" />

            <label>平段电价（AUD/kWh）</label>
            <input type="number" step="0.001" name="offpeak_rate" value="0.178" />

            <label>需量费（AUD/kW/月）</label>
            <input type="number" step="0.1" name="demand_charge" value="9.5" />

            <label>固定费（AUD/日）</label>
            <input type="number" step="0.1" name="fixed_daily" value="6.4" />

            <label>反送电单价（AUD/kWh）</label>
            <input type="number" step="0.001" name="export_rate" value="0.05" />

            <label>PV 候选容量（kWp，逗号分隔）</label>
            <input type="text" name="pv_candidates" value="0,100,150,200" />

            <label>电池功率候选（kW）</label>
            <input type="text" name="batt_kw_candidates" value="0,50,100" />

            <label>电池容量候选（kWh）</label>
            <input type="text" name="batt_kwh_candidates" value="0,100,200,300" />

            <label>电池最低SOC</label>
            <input type="number" step="0.05" min="0" max="0.5" name="batt_min_soc" value="0.1" />

            <label>电池往返效率</label>
            <input type="number" step="0.01" min="0.7" max="0.98" name="batt_eff" value="0.9" />

            <label>展示TOP条数</label>
            <input type="number" min="1" max="20" name="top_n" value="8" />

            <button class="btn" type="submit">开始分析</button>
          </form>

          <div class="tagline">示例数据：
            <a href="/sample/sample_load_hourly.csv">sample_load_hourly.csv</a>，
            <a href="/sample/sample_bill_summary.csv">sample_bill_summary.csv</a>
          </div>
        </section>

        <section class="card">
          <h3>2) 结果看板</h3>
          <div id="message" class="msg" style="display:none"></div>

          <div id="resultArea" style="display:none">
            <div class="kpi-grid">
              <div class="kpi"><div class="label">基准年电费</div><div class="value" id="kpiBaseline">-</div></div>
              <div class="kpi"><div class="label">基准年用电量</div><div class="value" id="kpiKwh">-</div></div>
              <div class="kpi"><div class="label">基准能量费</div><div class="value" id="kpiEnergy">-</div></div>
              <div class="kpi"><div class="label">基准需量费</div><div class="value" id="kpiDemand">-</div></div>
            </div>

            <div class="row" style="margin-top: 12px;">
              <button class="btn" id="downloadBtn">下载全部方案CSV</button>
              <button class="btn secondary" id="toggleTableBtn">展开所有方案</button>
            </div>

            <h4>Top 方案（按年化节省）</h4>
            <div class="split">
              <div>
                <canvas id="savingsChart" height="220"></canvas>
              </div>
              <div>
                <canvas id="costChart" height="220"></canvas>
              </div>
            </div>

            <div style="margin-top: 12px;">
              <h4>PV / 电池敏感性（kWh）</h4>
              <div id="pivotTableWrap" style="overflow:auto"></div>
            </div>

            <h4>Top 方案明细</h4>
            <div style="overflow:auto; max-height: 260px;">
              <table id="bestTable"></table>
            </div>

            <div id="moreTableWrap" style="display:none; overflow:auto; max-height: 320px; margin-top: 8px;">
              <h4>全部方案明细</h4>
              <table id="allTable"></table>
            </div>
          </div>
        </section>
      </div>
    </div>

    <script>
      const fmtMoney = (n) => {
        if (n === null || n === undefined || Number.isNaN(Number(n))) return '-';
        return Number(n).toLocaleString('en-AU', { style: 'currency', currency: 'AUD', maximumFractionDigits: 0 });
      };
      const fmtNum = (n, d = 1) => {
        if (n === null || n === undefined || Number.isNaN(Number(n))) return '-';
        return Number(n).toFixed(d);
      };

      let savingsChart = null;
      let costChart = null;
      let lastCSV = '';

      function renderTable(targetId, rows) {
        const table = document.getElementById(targetId);
        if (!rows || !rows.length) {
          table.innerHTML = '<thead></thead><tbody><tr><td>无数据</td></tr></tbody>';
          return;
        }
        const cols = [
          'pv_kw', 'battery_kwh', 'battery_kw', 'annual_savings', 'annual_grid_cost',
          'payback_years', 'npv_20y', 'irr_estimate', 'self_consumption_ratio',
          'annual_self_consumed_pv_kwh', 'annual_export_kwh', 'annual_import_kwh'
        ];
        let html = '<thead><tr>';
        html += cols.map(c => `<th>${c}</th>`).join('');
        html += '</tr></thead><tbody>';

        rows.forEach(r => {
          html += `<tr>
            <td>${fmtNum(r.pv_kw, 0)} kWp</td>
            <td>${fmtNum(r.battery_kwh, 0)} kWh</td>
            <td>${fmtNum(r.battery_kw, 0)} kW</td>
            <td>${fmtMoney(r.annual_savings)}</td>
            <td>${fmtMoney(r.annual_grid_cost)}</td>
            <td>${fmtNum(r.payback_years, 2)} 年</td>
            <td>${fmtMoney(r.npv_20y)}</td>
            <td>${fmtNum(r.irr_estimate * 100, 1)}%</td>
            <td>${fmtNum(r.self_consumption_ratio * 100, 1)}%</td>
            <td>${fmtNum(r.annual_self_consumed_pv_kwh, 1)} kWh</td>
            <td>${fmtNum(r.annual_export_kwh, 1)} kWh</td>
            <td>${fmtNum(r.annual_import_kwh, 1)} kWh</td>
          </tr>`;
        });
        html += '</tbody>';
        table.innerHTML = html;
      }

      function renderPivot(pivot) {
        const wrap = document.getElementById('pivotTableWrap');
        if (!pivot || !pivot.rows.length) {
          wrap.innerHTML = '<div class="small">无敏感性表数据</div>';
          return;
        }
        let html = '<table><thead><tr><th>PV kWp \ Battery kWh</th>';
        pivot.cols.forEach(c => {
          html += `<th>${fmtNum(c,0)}</th>`;
        });
        html += '</tr></thead><tbody>';
        pivot.rows.forEach((rowLabel, ri) => {
          html += `<tr><td>${fmtNum(rowLabel,0)} kWp</td>`;
          const row = pivot.matrix[ri] || [];
          row.forEach(v => {
            html += `<td>${fmtNum(v,0)}</td>`;
          });
          html += '</tr>';
        });
        html += '</tbody></table>';
        wrap.innerHTML = html;
      }

      function drawCharts(charts) {
        const labels = charts.labels || [];
        const savings = charts.annual_savings || [];
        const costs = charts.annual_grid_cost || [];
        const baseline = charts.baseline_cost || 0;

        if (savingsChart) savingsChart.destroy();
        if (costChart) costChart.destroy();

        savingsChart = new Chart(document.getElementById('savingsChart').getContext('2d'), {
          type: 'bar',
          data: {
            labels,
            datasets: [{
              label: '年化节省 AUD',
              data: savings,
              borderColor: '#16a34a',
              backgroundColor: 'rgba(22,163,74,0.35)',
            }]
          },
          options: {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: {
              y: { title: { display: true, text: 'AUD' } }
            }
          }
        });

        costChart = new Chart(document.getElementById('costChart').getContext('2d'), {
          type: 'bar',
          data: {
            labels: labels,
            datasets: [
              {
                label: '基准年电费',
                data: labels.map(() => baseline),
                backgroundColor: '#94a3b8'
              },
              {
                label: '方案后年电费',
                data: costs,
                backgroundColor: '#16a34a'
              }
            ]
          },
          options: {
            responsive: true,
            scales: {
              y: { title: { display: true, text: 'AUD' } }
            }
          }
        });
      }

      document.getElementById('analyzeForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const form = e.currentTarget;
        const btns = form.querySelector('button[type="submit"]');
        const msg = document.getElementById('message');
        msg.className = 'msg ok';
        msg.textContent = '正在计算，请稍候...';
        msg.style.display = 'block';
        btns.disabled = true;

        const fd = new FormData(form);
        try {
          const resp = await fetch('/api/analyze', { method: 'POST', body: fd });
          const data = await resp.json();
          if (!resp.ok || !data.ok) {
            throw new Error(data.error || '计算失败');
          }

          const b = data.baseline;
          document.getElementById('kpiBaseline').textContent = fmtMoney(b.total_cost);
          document.getElementById('kpiKwh').textContent = `${fmtNum(b.annual_kwh, 0)} kWh`;
          document.getElementById('kpiEnergy').textContent = fmtMoney(b.energy_cost);
          document.getElementById('kpiDemand').textContent = fmtMoney(b.demand_charge);

          document.getElementById('resultArea').style.display = 'block';
          renderTable('bestTable', data.best);
          renderTable('allTable', data.scenarios);
          renderPivot(data.charts.pivot);
          drawCharts(data.charts);
          lastCSV = data.scenarios_csv || '';

          msg.className = 'msg ok';
          msg.textContent = `分析完成：已评估 ${data.scenario_count} 个方案`;

          window.scrollTo({ top: 0, behavior: 'smooth' });
        } catch (err) {
          msg.className = 'msg error';
          msg.textContent = '分析失败：' + err.message;
          document.getElementById('resultArea').style.display = 'none';
        } finally {
          btns.disabled = false;
        }
      });

      document.getElementById('downloadBtn').addEventListener('click', () => {
        if (!lastCSV) return;
        const blob = new Blob([lastCSV], { type: 'text/csv;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'vic_feasibility_results.csv';
        a.click();
        URL.revokeObjectURL(a.href);
      });

      document.getElementById('toggleTableBtn').addEventListener('click', () => {
        const wrap = document.getElementById('moreTableWrap');
        if (wrap.style.display === 'none' || !wrap.style.display) {
          wrap.style.display = 'block';
        } else {
          wrap.style.display = 'none';
        }
      });
    </script>
  </body>
</html>

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "e3-ci-analyzer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "highspy==1.15.1",
]

[project.optional-dependencies]
api = [
    "alembic>=1.13,<2",
    "fastapi>=0.115,<0.116",
    "pypdf==6.14.2",
    "python-multipart>=0.0.9,<0.1",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.30,<1",
]
postgres = [
    "psycopg[binary]>=3.2,<4",
]
pdf = [
    "weasyprint==69.0",
    "brotli==1.2.0",
    "cffi==2.1.0",
    "cssselect2==0.9.0",
    "fonttools[woff]==4.63.0",
    "pillow==12.3.0",
    "pycparser==3.0",
    "pydyf==0.12.1",
    "pyphen==0.17.2",
    "tinycss2==1.5.1",
    "tinyhtml5==2.1.0",
    "webencodings==0.5.1",
    "zopfli==0.4.3",
]
dev = [
    "alembic>=1.13,<2",
    "fastapi>=0.115,<0.116",
    "httpx>=0.27",
    "pypdf==6.14.2",
    "pytest>=8",
    "pytest-xdist==3.8.0",
    "python-multipart>=0.0.9,<0.1",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.30,<1",
    "weasyprint==69.0",
    "brotli==1.2.0",
    "cffi==2.1.0",
    "cssselect2==0.9.0",
    "fonttools[woff]==4.63.0",
    "pillow==12.3.0",
    "pycparser==3.0",
    "pydyf==0.12.1",
    "pyphen==0.17.2",
    "tinycss2==1.5.1",
    "tinyhtml5==2.1.0",
    "webencodings==0.5.1",
    "zopfli==0.4.3",
]
[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "solar_battery*"]

[tool.setuptools.package-data]
solar_battery = ["defaults/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
